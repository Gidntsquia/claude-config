name: install

on:
  push:
  pull_request:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install Claude Code (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: claude doctor
        run: claude --version && claude doctor < /dev/null

      - name: Install scenarios with --terminal (Linux, macOS)
        if: runner.os != 'Windows'
        run: bash test/install-scenarios.sh --terminal

      - name: Install scenarios without --terminal (Windows, Git Bash)
        if: runner.os == 'Windows'
        env:
          MSYS: winsymlinks:nativestrict
        run: bash test/install-scenarios.sh --no-terminal

      - name: macOS --terminal with iTerm2 absent skips the profile
        if: runner.os == 'macOS'
        run: |
          test ! -d /Applications/iTerm.app
          H="$(mktemp -d)"
          out="$(HOME="$H" ./install.sh --projects '~/files' --terminal --default-profile --statusline squid --settings merge 2>&1)"
          echo "$out"
          echo "$out" | grep -q 'iTerm2 is not installed'
          HOME="$H" ./install.sh --check

      - name: Personal-path grep
        run: bash bin/find-personal-paths.sh
