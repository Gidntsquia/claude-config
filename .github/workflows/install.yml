name: install

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Every job runs one command, test/run <tier>. The steps before it only put tools on the runner.
# What each tier holds and what a pass means: TESTING.md.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the oldtag, plist and dirty scenarios install from older tags and commits
          submodules: recursive # bats and its three libraries, in test/vendor/

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      # Only while test/vendor/bats-core is not in the repo: test/run then takes a bats from PATH.
      - name: bats from a package when the submodule is absent
        run: |
          [ -f test/vendor/bats-core/bin/bats ] && exit 0
          case "$RUNNER_OS" in
            macOS)   brew install bats-core ;;
            Linux)   sudo apt-get install -y bats ;;
            Windows) npm install -g bats ;;
          esac

      - uses: astral-sh/setup-uv@v5   # test/run runs the pytest files through uv when pytest is not installed

      - name: Install Claude Code (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: test/run quick
        env:
          MSYS: winsymlinks:nativestrict   # Git Bash: real symlinks, as install.sh makes them
        run: test/run quick

      # The real tools: the keychain, the usage API over TLS, iTerm2. Last on macOS, because the iTerm2 test
      # changes the runner account's real iTerm2 preferences and ~/.claude.
      - name: test/run machine
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 20
        run: test/run machine

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: bats from a package when the submodule is absent
        run: '[ -f test/vendor/bats-core/bin/bats ] || { sudo apt-get update && sudo apt-get install -y bats; }'
      - name: test/run docker
        run: test/run docker

  # The update rehearsal (an older, lived-in install, then README's update sentence typed into claude -p) does not
  # run here: it needs a Claude login, and none is stored on GitHub. bin/release/rehearsal.sh runs it in Docker on the
  # maintainer's Mac before a release.
