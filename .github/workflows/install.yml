name: install

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "Also run the update rehearsal (one claude -p run per start release; needs the CLAUDE_CODE_OAUTH_TOKEN secret)"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the oldtag, plist and dirty scenarios install from older tags and commits

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install Claude Code (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: claude doctor
        run: claude --version && claude doctor < /dev/null

      - name: run-agent tests (Linux)
        if: runner.os == 'Linux'
        run: bash skills/run-agent/scripts/test.sh

      # A stock Mac: the system bash 3.2 and the system tools only (BSD date, sed, stat), plus tmux's folder.
      # Homebrew's bash and GNU tools on the runner's own PATH hid 140 failures a real Mac then showed.
      - name: run-agent tests under /bin/bash 3.2 with the stock PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          TMUX_DIR="$(dirname "$(command -v tmux)")"
          /bin/bash --version | head -1
          /bin/bash --version | grep -q 'version 3\.2'
          env -i HOME="$HOME" USER="$USER" TMPDIR="${TMPDIR:-/tmp}" TERM=xterm-256color LANG=en_US.UTF-8 \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin:$TMUX_DIR" /bin/bash skills/run-agent/scripts/test.sh

      - name: Keychain item read by parse.py through the real security (macOS)
        if: runner.os == 'macOS'
        run: /bin/bash test/real-usage.sh keychain

      - name: Unstubbed usage call with a fake token ends in HTTP 401 (Linux, macOS)
        if: runner.os != 'Windows'
        run: bash test/real-usage.sh usage

      - name: Install scenarios with --terminal (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          SCN_NEED_OLDTAG: 1
        run: bash test/install-scenarios.sh --terminal

      - name: Install scenarios without --terminal (Windows, Git Bash)
        if: runner.os == 'Windows'
        env:
          MSYS: winsymlinks:nativestrict
        run: bash test/install-scenarios.sh --no-terminal

      - name: macOS --terminal with iTerm2 absent skips the profile
        if: runner.os == 'macOS'
        run: |
          test ! -d /Applications/iTerm.app
          H="$(mktemp -d)"
          export PATH="$H/.local/bin:$PATH"
          out="$(HOME="$H" ./install.sh --projects '~/files' --terminal --default-profile --statusline squid --settings merge 2>&1)"
          echo "$out"
          echo "$out" | grep -q 'iTerm2 is not installed'
          HOME="$H" ./install.sh --check

      - name: Personal-path grep
        run: bash bin/find-personal-paths.sh

  # The same scenarios in a fresh ubuntu:24.04 container: no runner image, only git, curl, python3, tmux and
  # Claude Code. docker-install.sh exits non-zero when any scenario fails.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install scenarios in a Docker container
        env:
          SCN_NEED_OLDTAG: 1
        run: bash test/docker-install.sh

  # The dress rehearsal: in the same container, an older install with the user's own edits, then README's update
  # sentence typed into claude -p. Started by hand (Actions > install > Run workflow > rehearsal), since each run
  # spends Claude usage.
  rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.rehearsal
    strategy:
      fail-fast: false
      matrix:
        from: [v1.2.1, v1.3.0-beta.5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update rehearsal from ${{ matrix.from }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REHEARSAL_FROM: ${{ matrix.from }}
        run: bash test/rehearsal.sh "$RUNNER_TEMP/rehearsal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-${{ matrix.from }}
          path: ${{ runner.temp }}/rehearsal
