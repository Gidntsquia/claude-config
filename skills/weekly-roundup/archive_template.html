<title>Roundup Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f4f5f7; --card:#ffffff; --ink:#1c2027; --muted:#666f7d;
  --line:#e2e5ea; --blue:#3462e0; --shadow:0 1px 3px rgba(20,24,32,.08);
  --shadow-lg:0 10px 30px rgba(20,24,32,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#15171c; --card:#1d2027; --ink:#eceef2;
    --muted:#9aa2b1; --line:#2b2f38; --blue:#6d8dff; --shadow:0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#15171c; --card:#1d2027; --ink:#eceef2;
  --muted:#9aa2b1; --line:#2b2f38; --blue:#6d8dff; --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); font-family:'Source Sans 3',sans-serif; padding:28px 16px 60px; max-width:980px; margin:0 auto;}
h1{font-family:'Barlow Condensed',sans-serif; font-weight:700; margin:0; letter-spacing:.2px; font-size:2.3rem;}
.eyebrow{color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:1.5px; font-weight:600; margin-bottom:4px;}
header{margin-bottom:28px;}
.stats{color:var(--muted); font-size:.85rem; margin-top:6px; font-variant-numeric:tabular-nums;}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; margin-top:10px; padding-bottom:220px;}
.week-card{position:relative; background:var(--card); border-radius:10px; box-shadow:var(--shadow); border-top:3px solid var(--blue); padding:16px; text-decoration:none; color:inherit; display:block; transition:transform .12s, box-shadow .12s;}
.week-card:hover, .week-card:focus-visible{transform:translateY(-2px); box-shadow:var(--shadow-lg); z-index:5;}
.week-card:hover .hoverpanel, .week-card:focus-visible .hoverpanel{opacity:1; visibility:visible; transform:translateY(0);}
.week-range{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.25rem; margin-bottom:2px;}
.week-meta{color:var(--muted); font-size:.78rem; font-variant-numeric:tabular-nums; margin-bottom:14px;}
.donut-row{display:flex; align-items:center; gap:12px;}
.donut{width:56px; height:56px; border-radius:50%; flex:none; background:var(--line);}
.donut-cost{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.35rem; font-variant-numeric:tabular-nums;}
.donut-cost-label{color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:1px; font-weight:600;}
.hoverpanel{position:absolute; left:50%; top:calc(100% + 10px); transform:translateY(-6px); width:250px; margin-left:-125px; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-lg); padding:16px; opacity:0; visibility:hidden; transition:opacity .15s, transform .15s; pointer-events:none; z-index:10;}
.hoverpanel .donut{width:100px; height:100px; margin:0 auto 12px;}
.hoverpanel-legend{list-style:none; margin:0; padding:0; font-size:.76rem;}
.hoverpanel-legend li{display:flex; align-items:center; gap:6px; padding:2px 0;}
.hoverpanel-legend .sw{width:9px; height:9px; border-radius:2px; flex:none;}
.hoverpanel-legend .pct{margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums;}
.empty{color:var(--muted); text-align:center; padding:60px 0; font-size:.95rem;}
footer{margin-top:44px; color:var(--muted); font-size:.8rem; text-align:center;}
</style>

<header>
  <div class="eyebrow">Jaxon's usage history</div>
  <h1>Roundup Archive</h1>
  <div class="stats" id="stats"></div>
</header>

<div id="grid" class="grid"></div>

<footer>Generated by the weekly-roundup skill</footer>

<script type="application/json" id="weeks-data">__WEEKS_JSON__</script>
<script>
(function(){
  function conicGradient(slices){
    var acc = 0, stops = [];
    slices.forEach(function(s){
      var start = acc, end = acc + s.pct;
      stops.push(s.color + ' ' + start.toFixed(2) + '% ' + end.toFixed(2) + '%');
      acc = end;
    });
    return 'conic-gradient(' + stops.join(', ') + ')';
  }

  function cardHTML(w){
    var grad = conicGradient(w.slices);
    var legend = w.slices.map(function(s){
      return '<li><span class="sw" style="background:' + s.color + '"></span>' + s.name + '<span class="pct">' + s.pct.toFixed(1) + '%</span></li>';
    }).join('');
    return '' +
      '<a class="week-card" href="' + w.url + '" target="_self">' +
        '<div class="week-range">' + w.label + '</div>' +
        '<div class="week-meta">' + w.projectCount + ' project' + (w.projectCount===1?'':'s') + '</div>' +
        '<div class="donut-row">' +
          '<div class="donut" style="background:' + grad + '"></div>' +
          '<div><div class="donut-cost">$' + w.totalCost.toLocaleString('en-US',{maximumFractionDigits:0}) + '</div><div class="donut-cost-label">equiv. cost</div></div>' +
        '</div>' +
        '<div class="hoverpanel">' +
          '<div class="donut" style="background:' + grad + '"></div>' +
          '<ul class="hoverpanel-legend">' + legend + '</ul>' +
        '</div>' +
      '</a>';
  }

  var weeks = JSON.parse(document.getElementById('weeks-data').textContent);
  var grid = document.getElementById('grid');
  var stats = document.getElementById('stats');
  if(!weeks.length){
    grid.innerHTML = '<div class="empty">No roundups yet &mdash; the weekly-roundup skill adds one here each run.</div>';
    return;
  }
  weeks.sort(function(a,b){ return b.weekStart.localeCompare(a.weekStart); });
  stats.textContent = weeks.length + ' week' + (weeks.length===1?'':'s') + ' tracked';
  grid.innerHTML = weeks.map(cardHTML).join('');
})();
</script>
