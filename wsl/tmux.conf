# --- Gruvbox Dark theme, matched to ~/.config/starship.toml ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# prefix stays C-b (default); easy config reload
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# --- palette ---
# bg0    #282828
# bg1    #3c3836
# fg0    #fbf1c7
# orange #d65d0e
# yellow #d79921
# aqua   #689d6a
# blue   #458588
# red    #cc241d

# panes
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d65d0e"

# status bar
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#282828,fg=#fbf1c7"
set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[bg=#d65d0e,fg=#282828,bold]  tmux #[bg=#3c3836,fg=#d65d0e]#[bg=#3c3836,fg=#fbf1c7] #S #[bg=#282828,fg=#3c3836]"

set -g window-status-format "#[fg=#665c54] #I:#W "
set -g window-status-current-format "#[bg=#458588,fg=#282828]#[bg=#458588,fg=#fbf1c7,bold] #I:#W #[bg=#282828,fg=#458588]"

set -g status-right "#[fg=#665c54]#[bg=#689d6a,fg=#282828]#[bg=#689d6a,fg=#fbf1c7,bold]  %H:%M #[fg=#689d6a]#[bg=#3c3836,fg=#fbf1c7]  #(whoami)@#H "

# --- Claude Code dedicated layout ---
# ctrl-a C  -> new session laid out for a Claude Code pane + shell scratch pane
bind C new-session \; rename-window 'claude' \; split-window -h -p 30 \; select-pane -t 0 \; send-keys 'claude' C-m
